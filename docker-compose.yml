# Prerequisito: Supabase local corriendo (`npx supabase start`, ver README). Este compose
# YA NO levanta Postgres propio: la API se conecta al Postgres de Supabase local (Auth,
# Realtime y PostgREST del frontend usan esa misma base). `host.docker.internal` es cómo
# un contenedor llega al puerto publicado en el HOST por Supabase (Docker Desktop lo
# soporta out-of-the-box en Windows/Mac).
services:
  api:
    build: .
    container_name: mpv-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: "54322"
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SSLMODE: disable
      SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      SUPABASE_JWT_AUDIENCE: authenticated
      SUPABASE_JWKS_URL: http://host.docker.internal:54321/auth/v1/.well-known/jwks.json
      BACKEND_CORS_ORIGINS: "*"
      # El tope de escrituras públicas (10/minuto en producción) cuenta por IP, y en local TODA
      # la suite E2E sale de la misma: la corrida entera crea más de diez pacientes/consultas en
      # menos de un minuto, así que a partir de cierto punto los `POST /patients` devolvían 429 y
      # los specs fallaban con un `id` `undefined` — un fallo que no se reproduce al correr el
      # spec suelto y que parece cualquier cosa menos un rate limit.
      # Se sube en vez de apagarse (`RATE_LIMIT_ENABLED`) a propósito: así el middleware sigue
      # en el camino y local no deja de parecerse a producción en todo lo demás.
      PUBLIC_WRITE_RATE_LIMIT: "1000/minute"
      # Métricas de Kit en el panel de Marketing. Compose la toma del `.env` de esta carpeta (no
      # versionado); sin ella, el panel muestra solo las respuestas.
      KIT_API_KEY: ${KIT_API_KEY:-}
      # Verificación de correo (OTP) en dev/e2e: el endpoint de envío devuelve el código en la
      # respuesta, así los e2e no dependen de Mailtrap. En producción no existe (el arranque aborta).
      EMAIL_VERIFICATION_DEBUG_CODE: "true"
      # Mailtrap del `.env` local (no versionado). Sin token, el correo transaccional queda
      # deshabilitado; con debug activo el flujo local sigue funcionando.
      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-no-reply@medicosporvenezuela.org}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Médicos por Venezuela}
    volumes:
      # Hot-reload en desarrollo.
      - ./src:/code/src:ro
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
